[project]
name = "jev-study"
version = "0.1.0"
description = "Acervo local e RAG leve para estudar o Jev (TypeSafe AI), com respostas citadas via Claude Code CLI."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.scripts]
jev = "jev_study.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_study"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
